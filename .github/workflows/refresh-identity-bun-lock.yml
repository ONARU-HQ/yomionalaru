name: Refresh Bun lockfile for card UI repair
on:
  push:
    branches:
      - fix/identity-card-ui-production-lock-20261104
permissions:
  contents: write
concurrency:
  group: refresh-identity-lockfile
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/identity-card-ui-production-lock-20261104
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Recompute deterministic Bun lock from package.json
        run: bun install --lockfile-only
      - name: Commit only updated Bun lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "build(lock): synchronize frozen Bun dependency lock"
            git push origin HEAD:fix/identity-card-ui-production-lock-20261104
          fi
