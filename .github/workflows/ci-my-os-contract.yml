name: MY OS TRYSA Admin Build
on:
  pull_request:
    paths:
      - "src/lib/myos/**"
      - "src/routes/auth.tsx"
      - "tests/myos-trysa-oauth.test.ts"
      - "src/routes/api/auth/trysa/**"
      - "src/routes/api/admin/myos-owner-session.ts"
      - "src/routes/admin.my-os.tsx"
      - "src/routes/api/admin/myos-trysa-status.ts"
      - "src/components/admin/AdminShell.tsx"
      - "docs/integrations/my-os-trysa-admin.md"
      - ".github/workflows/ci-my-os-contract.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Verify TRYSA OAuth owner login safeguards
        run: bun test tests/myos-trysa-oauth.test.ts
      - name: Build YomiOnalaru Worker
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
