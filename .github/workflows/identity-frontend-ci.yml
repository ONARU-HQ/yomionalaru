name: Personal identity frontend QA

on:
  push:
    branches:
      - fix/identity-card-ui-production-lock-20261104
  pull_request:
    paths:
      - "src/components/founder/FounderUniverse3D.tsx"
      - "src/components/founder/IdentityCardShowcase.tsx"
      - "src/components/founder/LifeJourney3D.tsx"
      - "src/routes/journey.tsx"
      - "bun.lock"
      - "src/routes/sitemap[.]xml.ts"
      - "src/components/founder/FounderIdentityExperience.tsx"
      - "src/routes/index.tsx"
      - "src/routes/thinking.tsx"
      - "src/lib/site-data.ts"
      - "package.json"
      - "docs/PERSONAL_IDENTITY_WEB_APP_PRD_V2.md"
      - ".github/workflows/identity-frontend-ci.yml"

permissions:
  contents: read

jobs:
  mobile-first-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Resolve new Three.js dependencies
        run: bun install --frozen-lockfile
      - name: Verify frontend and Worker build
        run: bun run build
      - name: Check private owner modules are unchanged
        shell: bash
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '^src/(lib/myos/|routes/api/auth/trysa/|routes/api/admin/myos)' ; then
            echo 'Owner-only MY OS backend code must not change in public frontend PR'
            exit 1
          fi
