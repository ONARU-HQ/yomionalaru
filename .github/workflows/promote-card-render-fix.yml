name: One-time production promotion — homepage card render fix
on:
  push:
    paths:
      - '.github/workflows/promote-card-render-fix.yml'
permissions:
  contents: read
concurrency:
  group: yomi-production-promotion
  cancel-in-progress: false
jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify homepage mounts identity cards
        run: |
          grep -q 'import { IdentityCardShowcase }' src/components/founder/FounderIdentityExperience.tsx
          grep -q '<IdentityCardShowcase />' src/components/founder/FounderIdentityExperience.tsx
      - name: Build release
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Validate production bundle
        run: |
          test -f dist/server/wrangler.json
          test -d dist/client/assets
          if grep -rq "Missing Supabase environment variable" dist/client/assets \
             && ! grep -rqE 'https://[a-z0-9]+\.supabase\.co' dist/client/assets; then
            echo "::error::Missing required frontend config"
            exit 1
          fi
          rm -f dist/server/.dev.vars
      - name: Deploy to production Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy -c dist/server/wrangler.json --name yomionalaru
