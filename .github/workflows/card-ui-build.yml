name: Verify reference card UI build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Frozen dependency installation
        run: bun install --frozen-lockfile
      - name: Build static frontend and Cloudflare Worker
        run: bun run build
      - name: Ensure private MY OS auth routes are not changed by frontend PR
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '^src/(lib/myos/|routes/api/auth/trysa/|routes/api/admin/myos)' ; then
            echo "::error::Private MY OS integration cannot be modified in a public UI PR"
            exit 1
          fi
